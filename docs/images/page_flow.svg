  <g transform="translate(55 55)"><rect class="card" width="290" height="170" rx="18"/><circle class="circle" cx="38" cy="38" r="23"/><text class="num" x="31" y="47">1</text><text class="title" x="75" y="47">掩码审核</text><text class="text" x="28" y="95">删除错误掩码</text><text class="text" x="28" y="127">补充漏检物体并跟踪</text><text class="text" x="28" y="157">/review</text></g>
