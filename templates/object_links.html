<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>物体名词 ID 审核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09101a;color:#edf4ff;font:14px Inter,system-ui;padding:24px}a{color:#71b7ff}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap}button,input,select{background:#152235;color:#edf4ff;border:1px solid #31445f;border-radius:8px;padding:9px 11px}button{cursor:pointer}.stats{color:#9fb0c6;margin:12px 0 18px}.card{background:#111b2a;border:1px solid #263b56;border-radius:14px;padding:16px;margin:12px 0}.meta{color:#8295ae;font-size:12px;overflow-wrap:anywhere}.source,.linked{font-size:16px;line-height:1.6;padding:9px 0}.linked{color:#70d7a5}.mention{color:#ffd27a}.candidates{display:flex;gap:9px;overflow:auto;padding:8px 0}.candidate{min-width:145px;border:1px solid #304964;border-radius:10px;padding:8px;background:#152235}.candidate img{width:128px;height:100px;object-fit:contain;background:#05090f;border-radius:7px}.candidate label{display:block;margin-top:5px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.id-input{min-width:320px;flex:1}.error{color:#ff8e8e}.pager{display:flex;justify-content:center;gap:10px;margin-top:18px}
.evidence{margin:10px 0;padding:10px;background:#0b1421;border:1px solid #233850;border-radius:10px}.evidence summary{cursor:pointer;color:#9ed0ff}.streams{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-top:10px}.stream{min-width:0}.stream img,.stream video{display:block;width:100%;max-height:260px;object-fit:contain;background:#03070c;border-radius:8px}.stream video{margin-top:6px}.camera{color:#a8bad0;font-size:12px;margin-bottom:5px}
</style></head><body>
<div class="top"><div><h1>物体名词 ID 审核</h1><a href="/review">关键帧审核</a> · <a href="/dedup">去重审核</a> · <a href="/new-library">物体库</a></div>
<div class="toolbar"><select id="status"><option value="pending">待审核</option><option value="unresolved">未识别</option><option value="reviewed">已审核</option><option value="auto">自动完成</option><option value="all">全部</option></select><input id="query" placeholder="搜索数据集、原文或 ID"><button onclick="load(0)">查询</button></div></div>
<div id="stats" class="stats">加载中…</div><main id="list"></main><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div>
<script>
let offset=0,limit=10,total=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(nextOffset=offset){offset=Math.max(0,nextOffset);const status=document.getElementById('status').value,q=document.getElementById('query').value;const r=await fetch(`/api/object-links?status=${encodeURIComponent(status)}&q=${encodeURIComponent(q)}&offset=${offset}&limit=${limit}`);const d=await r.json();if(!r.ok){document.getElementById('stats').textContent=d.detail||r.status;return}total=d.total;document.getElementById('stats').textContent=`共 ${total} 条；自动 ${d.stats.auto||0}，待审核 ${d.stats.pending||0}，未识别 ${d.stats.unresolved||0}，已审核 ${d.stats.reviewed||0}`;document.getElementById('list').innerHTML=d.items.map(card).join('');document.getElementById('page').textContent=`${Math.min(total,offset+1)}–${Math.min(total,offset+limit)} / ${total}`;document.getElementById('prev').disabled=offset===0;document.getElementById('next').disabled=offset+limit>=total;}
function candidate(c,mentionId,selected=false){return `<div class="candidate"><img src="${esc(c.image_url)}" loading="lazy"><label><input type="checkbox" name="ids-${mentionId}" value="${esc(c.id)}" ${selected?'checked':''}> <b>${esc(c.id)}</b></label><small>${esc(c.category)} · ${esc(c.color)} · ${esc(c.material)}</small></div>`}
function loadEvidence(box){if(!box.open||box.dataset.loaded)return;box.dataset.loaded='1';box.querySelectorAll('[data-src]').forEach(el=>{el.src=el.dataset.src});box.querySelectorAll('[data-poster]').forEach(el=>{el.poster=el.dataset.poster})}
function evidence(x){const m=x.media||{},label=m.relation==='episode'?'对应 episode':m.relation==='representative'?'任务文本的代表 episode':'备用 episode';if(!m.streams?.length)return `<div class="evidence meta">未找到可播放的视频（${label} ${m.episode_index??'-'}）</div>`;const streams=m.streams.map(s=>`<div class="stream"><div class="camera">${esc(s.camera)}</div><img data-src="${esc(s.preview_url)}" loading="lazy" alt="episode ${m.episode_index} 代表画面"><video controls preload="none" data-poster="${esc(s.preview_url)}" data-src="${esc(s.video_url)}"></video></div>`).join('');return `<details class="evidence" ontoggle="loadEvidence(this)"><summary>查看画面与视频 · ${label} ${m.episode_index} · ${m.streams.length} 个相机</summary><div class="streams">${streams}</div></details>`}
function card(x){const options=x.candidates.map(c=>candidate(c,x.id,x.selected_ids.includes(c.id))).join('');const more=x.candidate_count>x.candidates.length?`<span class="meta">先显示 ${x.candidates.length}/${x.candidate_count} 个候选，可在下方继续搜索</span>`:'';return `<section class="card" id="m-${x.id}"><div class="meta">${esc(x.dataset)} · ${esc(x.source_path)} · line ${x.line_index+1} · 重复 ${x.occurrence_count} 次</div><div class="source">原文：${esc(x.source_text)}</div>${evidence(x)}<div>名词：<span class="mention">${esc(x.text)}</span> · 状态 ${esc(x.status)}</div><div class="candidates" id="candidates-${x.id}">${options||'<span class="meta">没有自动候选，请搜索物体库</span>'}${more}</div><div class="actions"><input id="search-${x.id}" placeholder="按 ID、类别、颜色搜索物体库"><button onclick="searchLibrary('${x.id}')">搜索候选</button></div><div class="actions"><input class="id-input" id="input-${x.id}" value="${esc(x.selected_ids.join(','))}" placeholder="输入一个或多个 ID，用逗号分隔"><button onclick="save('${x.id}',false)">保存替换</button><button onclick="save('${x.id}',true)">标记非物体</button><span class="error" id="err-${x.id}"></span></div></section>`}
async function searchLibrary(id){const q=document.getElementById(`search-${id}`).value.trim();if(!q)return;const r=await fetch(`/api/object-links/library/search?q=${encodeURIComponent(q)}`),d=await r.json();if(!r.ok){document.getElementById(`err-${id}`).textContent=d.detail||r.status;return}const box=document.getElementById(`candidates-${id}`);box.innerHTML=d.items.map(c=>candidate(c,id,false)).join('')||'<span class="meta">没有找到物体</span>'}
async function save(id,ignored){const checked=[...document.querySelectorAll(`input[name="ids-${id}"]:checked`)].map(x=>x.value);const typed=document.getElementById(`input-${id}`).value.split(',').map(x=>x.trim()).filter(Boolean);const selected=[...new Set([...checked,...typed])];const r=await fetch(`/api/object-links/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({selected_ids:selected,ignored})});const d=await r.json();if(!r.ok){document.getElementById(`err-${id}`).textContent=d.detail||r.status;return}load(offset)}
document.getElementById('prev').onclick=()=>load(offset-limit);document.getElementById('next').onclick=()=>load(offset+limit);document.getElementById('status').onchange=()=>load(0);load(0);
</script></body></html>
