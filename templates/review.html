<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多关键帧物体审核</title>
<style>
:root { color-scheme:dark; --bg:#090d14; --panel:#111824; --panel2:#172131; --line:#263247; --text:#eef5ff; --muted:#91a0b5; --blue:#5aa9ff; --red:#ff6b7d; --green:#54d69a; --shadow:0 18px 50px #0006; }
* { box-sizing:border-box; }
body { margin:0; background:radial-gradient(circle at 25% 0,#13233a 0,transparent 34%),var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button, select { font:inherit; }
.topbar { min-height:64px; display:flex; align-items:center; gap:16px; padding:10px 20px; border-bottom:1px solid var(--line); background:#0d131ee8; backdrop-filter:blur(14px); position:sticky; top:0; z-index:5; }
.brand { font-size:18px; font-weight:700; white-space:nowrap; }
.back { color:var(--muted); text-decoration:none; font-size:13px; white-space:nowrap; }
.back:hover { color:white; }
#sessionSelect { min-width:300px; width:min(520px,48vw); padding:9px 12px; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:9px; }
.status { margin-left:auto; font-size:13px; color:var(--muted); white-space:nowrap; }
.status.dirty { color:#ffc45c; }
.layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; height:calc(100vh - 64px); }
.workspace { min-width:0; display:flex; flex-direction:column; }
.toolbar { display:flex; flex-wrap:wrap; gap:7px; padding:11px 14px; border-bottom:1px solid var(--line); background:#0f1621; }
.quality-settings { border-bottom:1px solid var(--line); background:#111a27; }
.quality-settings summary { cursor:pointer; padding:10px 15px; color:#c9d8eb; font-size:13px; user-select:none; }
.quality-settings .settings-grid { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:2px 14px 12px; }
.quality-settings label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:5px; }
.quality-settings input,.quality-settings select { width:70px; padding:6px; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:6px; }
.quality-settings select { width:auto; }
.quality-settings .total { margin-left:auto; color:var(--muted); font-size:12px; }
button { border:1px solid var(--line); background:#1a2534; color:var(--text); padding:8px 12px; border-radius:8px; cursor:pointer; transition:.15s ease; }
button:hover:not(:disabled) { border-color:#54749e; background:#223249; transform:translateY(-1px); }
button.primary { background:#176fc1; border-color:#318de0; }
button.batch { background:#17784e; border-color:#35aa75; }
button:disabled { opacity:.4; cursor:not-allowed; }
button.active { border-color:var(--blue); color:#d9edff; background:#173656; }
button.danger { color:#ffdce1; border-color:#70414a; }
.hint { align-self:center; color:var(--muted); font-size:13px; margin-left:5px; }
.canvas-wrap { flex:1; min-height:0; overflow:auto; padding:20px; }
.canvas-stage { width:max-content; min-width:100%; display:flex; justify-content:center; align-items:flex-start; }
#canvas { display:block; max-width:none; box-shadow:var(--shadow); border:1px solid #2b3a50; border-radius:12px; cursor:pointer; touch-action:none; }
#canvas.adding { cursor:crosshair; }
.zoom-status { align-self:center; min-width:72px; color:var(--muted); font-size:12px; text-align:center; }
.sidebar { border-left:1px solid var(--line); background:#0e1520cc; display:flex; flex-direction:column; min-height:0; }
.side-head { padding:14px; border-bottom:1px solid var(--line); }
.side-head strong { font-size:15px; }
.side-head span { color:var(--muted); font-size:13px; margin-left:6px; }
.side-head button { float:right; padding:4px 7px; font-size:11px; }
.extracted-nouns { padding:11px 14px; border-bottom:1px solid var(--line); background:#101a28; }
.extracted-nouns b { display:block; margin-bottom:7px; color:#cfe4ff; font-size:12px; }
.noun-chips { display:flex; flex-wrap:wrap; gap:5px; }
.noun-chip { padding:3px 7px; color:#d8efff; background:#17314a; border:1px solid #315a7d; border-radius:999px; font-size:11px; }
.noun-empty { color:var(--muted); font-size:11px; }
.object-list { overflow:auto; padding:8px; }
.object-row { display:grid; grid-template-columns:24px 18px 1fr auto; align-items:center; gap:8px; padding:9px; border:1px solid transparent; border-radius:9px; cursor:pointer; user-select:none; }
.object-row:hover { background:#20242b; }
.object-row.selected { border-color:#477fb7; background:#182d43; }
.object-row input { pointer-events:none; }
.swatch { width:14px; height:14px; border-radius:4px; }
.obj-name { font-size:13px; }
.obj-source { font-size:11px; color:var(--muted); }
.score { font-size:11px; color:var(--muted); }
.empty { padding:28px 12px; text-align:center; color:var(--muted); }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); padding:10px 16px; background:#232832; border:1px solid #4a5362; border-radius:8px; box-shadow:0 5px 24px #000a; z-index:10; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show { opacity:1; }
.toast.error { border-color:#a94b58; color:#ffd5da; }
.loading { position:absolute; inset:0; display:none; place-items:center; background:#0d0f12b8; z-index:4; font-size:15px; }
.loading.show { display:grid; }
.loading-panel { width:min(620px,80vw); padding:18px; background:#111824; border:1px solid #3a4a62; border-radius:12px; box-shadow:var(--shadow); }
.loading-text { margin-bottom:11px; color:#e8f2ff; text-align:center; overflow-wrap:anywhere; }
.progress-track { position:relative; height:14px; overflow:hidden; background:#080c12; border:1px solid #2c3b50; border-radius:999px; }
.progress-fill { height:100%; width:0; background:linear-gradient(90deg,#1677ce,#54d69a); border-radius:inherit; transition:width .3s ease; }
.progress-track.indeterminate .progress-fill { width:35%; animation:progress-slide 1.2s ease-in-out infinite; }
.progress-percent { margin-top:7px; color:var(--muted); text-align:center; font-size:12px; }
.progress-actions { display:flex; justify-content:center; margin-top:12px; }
.progress-actions button { min-width:96px; }
.progress-actions button:disabled { cursor:not-allowed; opacity:.55; }
@keyframes progress-slide { from { transform:translateX(-110%); } to { transform:translateX(310%); } }
.report-modal { position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:25px; background:#05070bd9; }
.report-modal.hidden { display:none; }
.report-card { width:min(980px,94vw); max-height:88vh; display:flex; flex-direction:column; padding:15px; background:#111824; border:1px solid #40516b; border-radius:12px; box-shadow:var(--shadow); }
.report-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.report-head h3 { margin:0; }
.report-card pre { min-height:180px; margin:0; padding:12px; overflow:auto; color:#cbd8e8; background:#080c12; border:1px solid #263247; border-radius:8px; white-space:pre-wrap; font:12px/1.5 monospace; }
.keyframe-card { width:min(960px,94vw); max-height:92vh; padding:16px; background:#111824; border:1px solid #40516b; border-radius:12px; box-shadow:var(--shadow); }
.keyframe-preview { display:block; width:100%; max-height:68vh; object-fit:contain; margin:12px 0; background:#05080d; border:1px solid var(--line); border-radius:9px; }
.keyframe-controls { display:grid; grid-template-columns:1fr 92px; gap:10px; align-items:center; }
.keyframe-controls input { width:100%; }
.keyframe-time { padding:7px; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:7px; text-align:center; }
.keyframe-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
@media (max-width:850px) { .layout { grid-template-columns:1fr; height:auto; } .workspace { min-height:70vh; } .sidebar { border-left:0; border-top:1px solid var(--line); max-height:45vh; } #sessionSelect { min-width:140px; } .status { display:none; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">物体库 · 多关键帧审核</div>
  <a class="back" href="/new-library">物体库</a>
  <a class="back" href="/dedup">去重审核</a>
  <a class="back" href="/object-links">名词 ID 审核</a>
  <select id="sessionSelect" aria-label="选择视频"></select>
  <div id="saveStatus" class="status">正在读取…</div>
</header>
<main class="layout">
  <section class="workspace">
    <div class="toolbar">
      <button id="selectBtn" class="active">选择物体</button>
      <button id="addBtn">框选新增</button>
      <button id="pointBtn" disabled>添加正点</button>
      <button id="negativePointBtn" disabled>添加负点</button>
      <button id="clearPointsBtn" disabled>清除提示点</button>
      <button id="mergeBtn" disabled>合并所选</button>
      <button id="deleteBtn" class="danger" disabled>删除所选</button>
      <button id="undoBtn" disabled>撤销</button>
      <button id="clearBtn" disabled>取消选择</button>
      <select id="frameSelect" aria-label="选择发现关键帧"></select>
      <button id="keyframeBtn">追加关键帧</button>
      <button id="deleteKeyframeBtn" class="danger" disabled>删除当前关键帧</button>
      <button id="fitViewBtn" title="将完整图像缩放到当前窗口">适应窗口</button>
      <button id="originalViewBtn" title="按1:1像素查看2K图">原始2K</button>
      <span id="zoomStatus" class="zoom-status">100%</span>
      <button id="refineBtn" disabled>SAM3 细化人工框</button>
      <button id="trackBtn" class="primary" disabled>跟踪当前数据</button>
      <button id="trackAllBtn" class="batch" title="只跟踪修改后显示“等待跟踪”的数据">一键跟踪全部待更新数据</button>
      <span id="hint" class="hint">点击掩码或右侧列表进行选择</span>
    </div>
    <details class="quality-settings">
      <summary>高级设置 · 代表图质量评分</summary>
      <div class="settings-grid">
      <label title="物体内部边缘清晰程度">清晰度<input id="qualitySharpness" type="number" min="0" step="0.05" value="0.45"></label>
      <label title="物体掩码在画面中的相对面积">掩码面积<input id="qualityArea" type="number" min="0" step="0.05" value="0.20"></label>
      <label title="分割或跟踪模型的置信度">跟踪置信度<input id="qualityConfidence" type="number" min="0" step="0.05" value="0.15"></label>
      <label title="与相邻帧相比，掩码面积是否稳定">面积稳定性<input id="qualityStability" type="number" min="0" step="0.05" value="0.10"></label>
      <label title="物体不接触图像边界时得分更高">不贴边程度<input id="qualityBoundary" type="number" min="0" step="0.05" value="0.10"></label>
      <label title="候选掩码面积至少达到该物体最大面积的比例">最小相对面积<input id="qualityMinRelativeArea" type="number" min="0" max="1" step="0.05" value="0.25"></label>
      <label title="低于该值视为相邻帧面积突变">最小面积稳定性<input id="qualityMinStability" type="number" min="0" max="1" step="0.05" value="0.50"></label>
      <label title="过滤清晰度最低的分位比例">清晰度过滤分位<input id="qualityMinSharpnessQuantile" type="number" min="0" max="1" step="0.05" value="0.10"></label>
      <button id="resetQualityBtn">恢复默认</button>
      <span class="total" id="qualityTotal"></span>
      </div>
    </details>
    <div id="canvasWrap" class="canvas-wrap">
      <div class="canvas-stage"><canvas id="canvas"></canvas></div>
    </div>
  </section>
  <aside class="sidebar">
    <div class="side-head"><strong>初始物体</strong><span id="objectCount">0 个</span></div>
    <div class="extracted-nouns"><b>本数据从标注中提取的名词</b><div id="extractedNouns" class="noun-chips"><span class="noun-empty">正在读取…</span></div></div>
    <div id="objectList" class="object-list"></div>
  </aside>
</main>
<div id="loading" class="loading"><div class="loading-panel"><div id="loadingText" class="loading-text">正在处理并保存…</div><div id="progressTrack" class="progress-track indeterminate"><div id="progressFill" class="progress-fill"></div></div><div id="progressPercent" class="progress-percent">准备中…</div><div class="progress-actions"><button id="cancelJobBtn" class="danger" type="button" hidden>取消任务</button></div></div></div>
<div id="toast" class="toast"></div>
<div id="batchReport" class="report-modal hidden"><div class="report-card"><div class="report-head"><h3>全部数据跟踪报告</h3><button id="closeBatchReport">关闭</button></div><pre id="batchReportText"></pre></div></div>
<div id="keyframeModal" class="report-modal hidden"><div class="keyframe-card"><div class="report-head"><h3>追加发现关键帧</h3><button id="closeKeyframeBtn">关闭</button></div><div class="hint">拖动时显示原视频画面；确认后会先生成2K图，再运行 SAM3 并追加候选。已有关键帧和物体不会被覆盖。</div><img id="keyframePreview" class="keyframe-preview" alt="关键帧预览"><div class="keyframe-controls"><input id="keyframeSlider" type="range" min="0" max="0" step="0.1" value="0"><input id="keyframeTime" class="keyframe-time" type="number" min="0" step="0.1" value="0" aria-label="关键帧秒数"></div><div class="keyframe-actions"><button id="cancelKeyframeBtn">取消</button><button id="confirmKeyframeBtn" class="primary">确认并追加发现</button></div></div></div>

<script>
const palette = ['#ff5c72','#4da3ff','#55d98b','#ffc857','#b57aff','#ff8f4d','#38cad3','#f06ac4','#a8d65e','#8b9cff','#f47560','#67c5a4','#d7a64a','#ad7dd8','#5bb8ef','#e3769d','#9bc56b','#e89b55','#79a7e8','#cb78d4'];
const MASK_LOAD_CONCURRENCY = 6;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const selectEl = document.getElementById('sessionSelect');
const frameSelectEl = document.getElementById('frameSelect');
const listEl = document.getElementById('objectList');
const loadingEl = document.getElementById('loading');
const loadingTextEl = document.getElementById('loadingText');
const progressTrackEl = document.getElementById('progressTrack');
const progressFillEl = document.getElementById('progressFill');
const progressPercentEl = document.getElementById('progressPercent');
const cancelJobBtn = document.getElementById('cancelJobBtn');
const statusEl = document.getElementById('saveStatus');
const hintEl = document.getElementById('hint');
const keyframeModal=document.getElementById('keyframeModal');
const keyframePreview=document.getElementById('keyframePreview');
const keyframeSlider=document.getElementById('keyframeSlider');
const keyframeTime=document.getElementById('keyframeTime');
let session = null;
let frameImage = null;
let overlays = [];
let selected = new Set();
let mode = 'select';
let renderScale = 1;
let viewScale = 1;
let viewMode = 'fit';
let dragStart = null;
let dragCurrent = null;
let busy = false;
let activeJobId = null;
let cancelRequested = false;
const ACTIVE_BATCH_JOB_KEY = 'robocoinActiveBatchJobId';

function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
let currentProgressPercent = 0;
let reviewSessionSummaries = [];
const qualityDefaults={quality_sharpness:0.45,quality_area:0.20,quality_confidence:0.15,quality_stability:0.10,quality_boundary:0.10};
const qualityInputs={quality_sharpness:'qualitySharpness',quality_area:'qualityArea',quality_confidence:'qualityConfidence',quality_stability:'qualityStability',quality_boundary:'qualityBoundary'};

function loadQualityWeights(){let saved={};try{saved=JSON.parse(localStorage.getItem('robocoinQualityWeights')||'{}')}catch(_){}for(const [key,id] of Object.entries(qualityInputs))document.getElementById(id).value=saved[key]!==undefined?saved[key]:qualityDefaults[key];document.getElementById('qualityMinRelativeArea').value=saved.quality_min_relative_area!==undefined?saved.quality_min_relative_area:0.25;document.getElementById('qualityMinStability').value=saved.quality_min_stability!==undefined?saved.quality_min_stability:0.50;document.getElementById('qualityMinSharpnessQuantile').value=saved.quality_min_sharpness_quantile!==undefined?saved.quality_min_sharpness_quantile:0.10;updateQualityTotal()}
function qualityWeights(){const result={};for(const [key,id] of Object.entries(qualityInputs)){const value=Number(document.getElementById(id).value);if(!Number.isFinite(value)||value<0)throw new Error('质量权重必须是非负数');result[key]=value}if(Object.values(result).every(value=>value===0))throw new Error('质量权重不能全部为0');for(const [key,id] of [['quality_min_relative_area','qualityMinRelativeArea'],['quality_min_stability','qualityMinStability'],['quality_min_sharpness_quantile','qualityMinSharpnessQuantile']]){const value=Number(document.getElementById(id).value);if(!Number.isFinite(value)||value<0||value>1)throw new Error('硬过滤参数必须在0到1之间');result[key]=value}localStorage.setItem('robocoinQualityWeights',JSON.stringify(result));return result}
function updateQualityTotal(){let total=0;for(const id of Object.values(qualityInputs))total+=Number(document.getElementById(id).value)||0;document.getElementById('qualityTotal').textContent=`权重和 ${total.toFixed(2)}（自动归一化）`}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error('图片加载失败：' + url));
    image.src = url;
  });
}

function showToast(message, error=false) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'toast show' + (error ? ' error' : '');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => el.className = 'toast', 2600);
}

function setProgress(percent, message) {
  loadingTextEl.textContent = message || '正在处理…';
  const determinate = Number.isFinite(percent);
  progressTrackEl.classList.toggle('indeterminate', !determinate);
  if (determinate) {
    const value=Math.max(0,Math.min(100,Number(percent)));
    currentProgressPercent=value;
    progressFillEl.style.width=value+'%';
    progressFillEl.style.transform='none';
    progressPercentEl.textContent=value.toFixed(value<10?1:0)+'%';
  } else {
    progressFillEl.style.width='35%';
    progressFillEl.style.transform='';
    progressPercentEl.textContent='处理中…';
  }
}

function updateJobProgress(result, fallback) {
  if (result.progress) setProgress(result.progress.percent, result.progress.message);
  else setProgress(currentProgressPercent, fallback);
}

async function api(url, options={}) {
  const response = await fetch(url, options);
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(data.detail || `请求失败 (${response.status})`);
  return data;
}

async function refreshSessionOptions(preferredKey=null){
  const data=await api('/api/review/sessions',{cache:'no-store'});
  reviewSessionSummaries=data.sessions;
  const keep=preferredKey||selectEl.value;
  selectEl.innerHTML='';
  for(const item of data.sessions){
    const option=document.createElement('option');option.value=item.key;option.dataset.label=item.label;
    const datasetName=String(item.label||item.key).split('/')[0].replaceAll('_',' ');
    option.textContent=`${datasetName}（${item.object_count}个掩码）`;
    option.title=`完整数据路径：${item.label}`;
    selectEl.appendChild(option);
  }
  if(keep&&data.sessions.some(item=>item.key===keep))selectEl.value=keep;
  return data.sessions;
}

function renderFrameOptions(){
  frameSelectEl.innerHTML='';
  for(const frame of session.discovery_frames||[]){
    const option=document.createElement('option');
    option.value=frame.frame_id;
    option.textContent=`${Number(frame.timestamp_seconds||0).toFixed(1)}s · ${frame.object_count}个`;
    frameSelectEl.appendChild(option);
  }
  frameSelectEl.value=session.active_frame_id;
}

function fitViewScale(){
  if(!frameImage)return 1;
  const availableWidth=Math.max(1,canvasWrap.clientWidth-40);
  const availableHeight=Math.max(1,canvasWrap.clientHeight-40);
  return Math.min(1,availableWidth/frameImage.naturalWidth,availableHeight/frameImage.naturalHeight);
}

function setViewScale(next,mode='custom',center=true){
  if(!frameImage)return;
  viewScale=Math.max(.1,Math.min(2,Number(next)||1));
  viewMode=mode;
  canvas.style.width=Math.round(canvas.width*viewScale)+'px';
  canvas.style.height=Math.round(canvas.height*viewScale)+'px';
  document.getElementById('zoomStatus').textContent=`${Math.round(viewScale*100)}% · ${canvas.width}×${canvas.height}`;
  document.getElementById('fitViewBtn').classList.toggle('active',viewMode==='fit');
  document.getElementById('originalViewBtn').classList.toggle('active',viewMode==='original');
  draw();
  if(center)requestAnimationFrame(()=>{
    canvasWrap.scrollLeft=Math.max(0,(canvasWrap.scrollWidth-canvasWrap.clientWidth)/2);
    canvasWrap.scrollTop=Math.max(0,(canvasWrap.scrollHeight-canvasWrap.clientHeight)/2);
  });
}

function fitView(){setViewScale(fitViewScale(),'fit')}
function originalView(){setViewScale(1,'original')}

async function initialize() {
  try {
    const sessions=await refreshSessionOptions();
    if (!sessions.length) {
      selectEl.innerHTML = '<option>没有可审核的首帧结果</option>';
      statusEl.textContent = '请先运行第一阶段物体发现';
      return;
    }
    await loadSession(sessions[0].key);
    await resumeAllTrackingIfNeeded();
  } catch (error) { showToast(error.message, true); statusEl.textContent = '加载失败'; }
}

async function loadSession(key, frameId=null) {
  setBusy(true);
  setProgress(5, '正在读取审核数据…');
  try {
    const frameQuery=frameId?'&frame_id='+encodeURIComponent(frameId):'';
    session = await api('/api/review/session?session=' + encodeURIComponent(key)+frameQuery);
    selectEl.value = key;
    renderFrameOptions();
    selected.clear();
    await buildVisuals(15, 95, '正在加载发现帧和掩码');
    refreshUI();
    setProgress(100, `已加载 ${session.objects.length} 个物体`);
  } catch (error) { showToast(error.message, true); }
  finally { setBusy(false); }
}

async function buildVisuals(startPercent=0, endPercent=100, label='正在加载图像') {
  const visualObjects=session.objects;
  const total = Math.max(1, visualObjects.length + 1);
  let completed = 0;
  const report = detail => {
    completed += 1;
    const percent = startPercent + (endPercent - startPercent) * completed / total;
    setProgress(percent, `${label}：${completed}/${total}${detail ? ' · ' + detail : ''}`);
  };
  frameImage = await loadImage(session.frame_url);
  report('发现帧');
  renderScale = 1;
  canvas.width = frameImage.naturalWidth;
  canvas.height = frameImage.naturalHeight;
  setViewScale(fitViewScale(),'fit');
  overlays = new Array(visualObjects.length);
  let nextOverlayIndex = 0;
  async function loadOverlayWorker() {
    while (nextOverlayIndex < visualObjects.length) {
      const index = nextOverlayIndex++;
      const object = visualObjects[index];
      const maskImage = await loadImage(object.mask_url);
      const rawBox = object.bbox.map(value => value * renderScale);
      const x1 = Math.max(0, Math.min(canvas.width - 1, Math.floor(rawBox[0])));
      const y1 = Math.max(0, Math.min(canvas.height - 1, Math.floor(rawBox[1])));
      const x2 = Math.max(x1 + 1, Math.min(canvas.width, Math.ceil(rawBox[2])));
      const y2 = Math.max(y1 + 1, Math.min(canvas.height, Math.ceil(rawBox[3])));
      const width = x2 - x1, height = y2 - y1;
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = width;
      maskCanvas.height = height;
      const maskCtx = maskCanvas.getContext('2d', {willReadFrequently:true});
      maskCtx.drawImage(maskImage, x1, y1, width, height, 0, 0, width, height);
      const pixels = maskCtx.getImageData(0, 0, width, height);
      const hitData = new Uint8Array(width * height);
      const color = hexToRgb(palette[index % palette.length]);
      for (let p=0, q=0; p<pixels.data.length; p+=4, q++) {
        const inside = pixels.data[p] > 127;
        hitData[q] = inside ? 1 : 0;
        pixels.data[p] = color[0]; pixels.data[p+1] = color[1]; pixels.data[p+2] = color[2];
        pixels.data[p+3] = inside ? 165 : 0;
      }
      maskCtx.putImageData(pixels, 0, 0);
      overlays[index] = {
        object, color:palette[index % palette.length], canvas:maskCanvas,
        hitData, x:x1, y:y1, width, height,
      };
      report(`掩码 ${index + 1}/${session.objects.length}`);
      await new Promise(resolve => setTimeout(resolve, 0));
    }
  }
  const workerCount = Math.min(MASK_LOAD_CONCURRENCY, visualObjects.length);
  await Promise.all(Array.from({length:workerCount}, () => loadOverlayWorker()));
  draw();
}

function hexToRgb(hex) { return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }

function draw() {
  if (!frameImage) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(frameImage,0,0,canvas.width,canvas.height);
  const unit=1/viewScale;
  for (const overlay of overlays) {
    const isSelected = selected.has(overlay.object.object_id);
    ctx.save();
    ctx.globalAlpha = isSelected ? 1 : .55;
    ctx.drawImage(overlay.canvas,overlay.x,overlay.y);
    const b = overlay.object.bbox.map(v => v * renderScale);
    ctx.strokeStyle = overlay.color;
    ctx.lineWidth = (isSelected ? 4 : 1.5)*unit;
    ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);
    ctx.fillStyle = overlay.color;
    ctx.font = `bold ${13*unit}px sans-serif`;
    const label='#'+String(overlay.object.object_id).padStart(2,'0')+' '+(overlay.object.prompt_zh||'未命名物体');
    const labelWidth=Math.max(52*unit,ctx.measureText(label).width+10*unit);
    ctx.fillRect(b[0],Math.max(0,b[1]-19*unit),labelWidth,19*unit);
    ctx.fillStyle = '#101216';
    ctx.fillText(label,b[0]+5*unit,Math.max(14*unit,b[1]-5*unit));
    ctx.restore();
  }
  for(const overlay of overlays){
    const points=overlay.object.prompt_points||[];
    for(let index=0;index<points.length;index++){
      const x=points[index][0]*renderScale,y=points[index][1]*renderScale;
      ctx.save();ctx.beginPath();ctx.arc(x,y,7*unit,0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill();ctx.lineWidth=3*unit;ctx.strokeStyle='#35d07f';ctx.stroke();ctx.fillStyle='#145c39';ctx.font=`bold ${9*unit}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(index+1),x,y+.5*unit);ctx.restore();
    }
    const negativePoints=overlay.object.prompt_negative_points||[];
    for(const point of negativePoints){
      const x=point[0]*renderScale,y=point[1]*renderScale;
      ctx.save();ctx.strokeStyle='#ff4057';ctx.lineWidth=4*unit;ctx.beginPath();ctx.moveTo(x-6*unit,y-6*unit);ctx.lineTo(x+6*unit,y+6*unit);ctx.moveTo(x+6*unit,y-6*unit);ctx.lineTo(x-6*unit,y+6*unit);ctx.stroke();ctx.restore();
    }
  }
  if (dragStart && dragCurrent) {
    ctx.save(); ctx.strokeStyle='#fff'; ctx.lineWidth=2*unit; ctx.setLineDash([8*unit,5*unit]);
    ctx.fillStyle='#4da3ff33';
    const x=Math.min(dragStart.x,dragCurrent.x), y=Math.min(dragStart.y,dragCurrent.y);
    const w=Math.abs(dragStart.x-dragCurrent.x), h=Math.abs(dragStart.y-dragCurrent.y);
    ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h); ctx.restore();
  }
}

    row.onclick=()=>toggleSelection(o.object_id);
    listEl.appendChild(row);
  });
  document.getElementById('mergeBtn').disabled = busy || selected.size < 2;
  document.getElementById('deleteBtn').disabled = busy || selected.size < 1;

  document.getElementById('clearPointsBtn').disabled=busy||!canPoint||!((selectedOverlay.object.prompt_points||[]).length+(selectedOverlay.object.prompt_negative_points||[]).length);
  document.getElementById('undoBtn').disabled = busy || !session.can_undo;
  document.getElementById('refineBtn').disabled = busy || !overlays.some(item => ['manual_box','sam3_box_refined'].includes(item.object.source));
  document.getElementById('trackBtn').disabled = busy || !overlays.length || !session.tracker_dirty;
  document.getElementById('trackAllBtn').disabled = busy || !reviewSessionSummaries.some(item=>item.tracker_dirty);

function toggleSelection(id) {
  if (selected.has(id)) selected.delete(id); else selected.add(id);
  refreshUI();
}

function canvasPoint(event) {
  const rect=canvas.getBoundingClientRect();
  return {x:(event.clientX-rect.left)*canvas.width/rect.width, y:(event.clientY-rect.top)*canvas.height/rect.height};
}

canvas.addEventListener('pointerdown', async event => {
  if (busy) return;
  const point=canvasPoint(event);
  if (mode==='add') { dragStart=point; dragCurrent=point; canvas.setPointerCapture(event.pointerId); draw(); return; }
  if(mode==='point'||mode==='negative_point'){
    if(selected.size!==1){showToast('请先选择一个人工框',true);return}
    await perform(mode==='point'?'add_point':'add_negative_point',[...selected],null,[point.x/renderScale,point.y/renderScale]);return;
  }
  const x=Math.floor(point.x), y=Math.floor(point.y);
  for (let i=overlays.length-1;i>=0;i--) {
    const overlay=overlays[i], localX=x-overlay.x, localY=y-overlay.y;
    if (localX>=0&&localY>=0&&localX<overlay.width&&localY<overlay.height&&overlay.hitData[localY*overlay.width+localX]) { toggleSelection(overlay.object.object_id); return; }
  }
});
canvas.addEventListener('pointermove', event => { if (dragStart) { dragCurrent=canvasPoint(event); draw(); } });
canvas.addEventListener('pointerup', async event => {
  if (!dragStart) return;
  dragCurrent=canvasPoint(event);
  const box=[dragStart.x/renderScale,dragStart.y/renderScale,dragCurrent.x/renderScale,dragCurrent.y/renderScale];
  dragStart=null; dragCurrent=null; draw();
  await perform('add_box',[],box);
});

canvasWrap.addEventListener('wheel',event=>{
  if(!frameImage||busy)return;
  event.preventDefault();
  const oldRect=canvas.getBoundingClientRect();
  const fractionX=Math.max(0,Math.min(1,(event.clientX-oldRect.left)/Math.max(1,oldRect.width)));
  const fractionY=Math.max(0,Math.min(1,(event.clientY-oldRect.top)/Math.max(1,oldRect.height)));
  const factor=event.deltaY<0?1.15:1/1.15;
  setViewScale(viewScale*factor,'custom',false);
  const newRect=canvas.getBoundingClientRect();
  canvasWrap.scrollLeft+=newRect.left+fractionX*newRect.width-event.clientX;
  canvasWrap.scrollTop+=newRect.top+fractionY*newRect.height-event.clientY;
},{passive:false});

function setMode(next) {
  mode=next; dragStart=null; dragCurrent=null;
  document.getElementById('selectBtn').classList.toggle('active',mode==='select');
  document.getElementById('addBtn').classList.toggle('active',mode==='add');
  document.getElementById('pointBtn').classList.toggle('active',mode==='point');
  document.getElementById('negativePointBtn').classList.toggle('active',mode==='negative_point');
  canvas.classList.toggle('adding',mode==='add'||mode==='point'||mode==='negative_point');
  hintEl.textContent=mode==='add'?'在漏检物体周围拖出矩形框':mode==='point'?'在目标物体内部点击正点':mode==='negative_point'?'在框内不需要的背景或机械臂上点击负点':'点击掩码或右侧列表进行选择';
  draw();
}

async function perform(action, ids=[], box=null, point=null) {
  const previousSelection=[...selected];
  setBusy(true);
  setProgress(5, '正在保存审核修改…');
  try {
    session=await api('/api/review/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:session.key,action,object_ids:ids,box,point,frame_id:session.active_frame_id})});
    await refreshSessionOptions(session.key);
    renderFrameOptions();
    selected.clear();if(action==='add_point'||action==='add_negative_point'||action==='clear_points')for(const id of previousSelection)selected.add(id);
    setProgress(35, '修改已保存，正在重新加载掩码…');
    await buildVisuals(35, 95, '正在重新加载发现帧和掩码'); refreshUI();
    setProgress(100, '修改已保存');
    showToast(action==='undo'?'已撤销上一项操作':action==='delete_keyframe'?'关键帧及其掩码已删除，数量已更新':'修改已保存，可以直接启动跟踪');
  } catch(error) { showToast(error.message,true); }
  finally { setBusy(false); refreshUI(); }
}

async function startJob(kind) {
  let weights;
  try { weights=qualityWeights(); } catch(error) { showToast(error.message,true); return; }
  if (kind==='refine' && !confirm('使用 SAM3 原生框＋正负点提示重新分割所有人工框？完成后请再次检查掩码。')) return;
  if (kind==='track' && !confirm('使用当前保存的掩码，以 1 FPS 启动 SAM 3.1 multiplex 跟踪？这可能需要数分钟。')) return;
  setBusy(true, true);
  setProgress(0, kind==='refine' ? 'SAM3 正在准备细化人工框…' : 'SAM 3.1 正在准备使用当前掩码跟踪…');
  try {
    const started=await api('/api/review/job',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session:session.key,kind,frame_id:session.active_frame_id,...weights})});
    activeJobId=started.job_id;
    cancelJobBtn.disabled=false;
    let result;
    while (true) {
      await new Promise(resolve=>setTimeout(resolve,2000));
      result=await api('/api/review/job/'+started.job_id);
      updateJobProgress(result, kind==='refine'?'SAM3 正在细化人工框…':'SAM 3.1 正在跟踪视频…');
      if (!result.running) break;
    }
    if (result.cancelled || cancelRequested) {
      setProgress(currentProgressPercent, '任务已取消');
      showToast('任务已取消');
      return;
    }
    if (result.return_code!==0) throw new Error((result.log.trim().split('\n').slice(-3).join(' ')||'模型任务失败'));
    session=await api('/api/review/session?session='+encodeURIComponent(session.key)+'&frame_id='+encodeURIComponent(session.active_frame_id));
    await refreshSessionOptions(session.key);
    selected.clear(); setProgress(100, '模型任务完成，正在刷新结果…'); await buildVisuals(100, 100, '正在刷新结果'); refreshUI();
    setProgress(100, kind==='refine'?'SAM3 细化完成':'SAM 3.1 掩码跟踪完成');
    showToast(kind==='refine'?'SAM3 细化完成，请重新审核':'SAM 3.1 掩码跟踪完成');
  } catch(error) { showToast(error.message,true); }
  finally { setBusy(false);refreshUI(); }
}

function showBatchReport(text) {

async function startAllTracking() {
  let weights;
  try { weights=qualityWeights(); } catch(error) { showToast(error.message,true); return; }
  const count=reviewSessionSummaries.filter(item=>item.tracker_dirty).length;
  if (!count){showToast('没有需要重新跟踪的数据');return}
  if (!confirm(`将只跟踪修改过的 ${count} 个审核会话。\n\n已显示“跟踪已更新”的数据会直接跳过，不重新抽帧或跟踪。是否继续？`)) return;
  try {
    const started=await api('/api/review/job/all',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(weights)});
    await monitorAllTracking(started.job_id, started.dirty_count||count);
  } catch(error) { showToast(error.message,true); }
}

async function monitorAllTracking(jobId, count=0) {
  let result=null;
  setBusy(true, true);
  activeJobId=jobId;
  localStorage.setItem(ACTIVE_BATCH_JOB_KEY,jobId);
  cancelJobBtn.disabled=false;
  setProgress(0, count?`SAM 3.1 正在跟踪 ${count} 个待更新数据…`:'正在恢复 SAM 3.1 跟踪进度…');
  try {
    while (true) {
      await new Promise(resolve=>setTimeout(resolve,2000));
      result=await api('/api/review/job/'+jobId);
      updateJobProgress(result, 'SAM 3.1 正在批量跟踪待更新数据…');
      if (!result.running) break;
    }
    localStorage.removeItem(ACTIVE_BATCH_JOB_KEY);
    showBatchReport(result.log);
    if (result.cancelled || cancelRequested) {
      setProgress(currentProgressPercent, '批量跟踪已取消');
      showToast('批量跟踪已取消，已完成的文件不会被删除');
      return;
    }
    if (result.return_code!==0) throw new Error('批量跟踪进程失败，请查看跟踪报告');
    session=await api('/api/review/session?session='+encodeURIComponent(session.key));
    await refreshSessionOptions(session.key);
    const remaining=reviewSessionSummaries.filter(item=>item.tracker_dirty).length;
    selected.clear(); setProgress(100, '跟踪完成，正在刷新当前数据…'); await buildVisuals(100, 100, '正在刷新当前数据'); refreshUI();
    setProgress(100, '待更新数据跟踪完成');
    showToast(remaining ? `批量任务结束，仍有 ${remaining} 个失败或未完成数据等待跟踪` : `已完成 ${count} 个待更新数据，其他数据未重跑`, remaining>0);
  } catch(error) {
    if (result && result.log) showBatchReport(result.log);
    showToast(error.message,true);
  } finally { setBusy(false);refreshUI(); }
}

async function resumeAllTrackingIfNeeded() {
  const queryJobId=new URLSearchParams(window.location.search).get('job_id');
  const jobId=queryJobId||localStorage.getItem(ACTIVE_BATCH_JOB_KEY);
  if(!jobId)return;
  try {
    const result=await api('/api/review/job/'+encodeURIComponent(jobId));
    if(!result.running){localStorage.removeItem(ACTIVE_BATCH_JOB_KEY);return}
    const count=reviewSessionSummaries.filter(item=>item.tracker_dirty).length;
    await monitorAllTracking(jobId,count);
  } catch(error) {
    localStorage.removeItem(ACTIVE_BATCH_JOB_KEY);
    showToast('无法恢复批量跟踪进度：'+error.message,true);
  }
}

document.getElementById('clearBtn').onclick=()=>{selected.clear();refreshUI();};
document.getElementById('keyframeBtn').onclick=openKeyframePicker;
document.getElementById('deleteKeyframeBtn').onclick=()=>{const frame=session.active_discovery_frame||{};const count=Number(frame.object_count)||session.objects.length;if(confirm(`确定删除当前 ${Number(frame.timestamp_seconds||0).toFixed(1)}s 关键帧及其 ${count} 个掩码吗？可以撤销。`))perform('delete_keyframe')};
document.getElementById('fitViewBtn').onclick=fitView;
document.getElementById('originalViewBtn').onclick=originalView;
document.getElementById('closeKeyframeBtn').onclick=closeKeyframePicker;
document.getElementById('cancelKeyframeBtn').onclick=closeKeyframePicker;
document.getElementById('confirmKeyframeBtn').onclick=startKeyframeJob;
keyframeSlider.oninput=()=>requestKeyframePreview(keyframeSlider.value);
keyframeTime.onchange=()=>requestKeyframePreview(keyframeTime.value);
document.getElementById('mergeBtn').onclick=()=>perform('merge',[...selected]);
document.getElementById('deleteBtn').onclick=()=>{if(confirm(`确定删除选中的 ${selected.size} 个物体吗？可以撤销。`))perform('delete',[...selected]);};
document.getElementById('undoBtn').onclick=()=>perform('undo');
document.getElementById('refineBtn').onclick=()=>startJob('refine');
document.getElementById('trackBtn').onclick=()=>startJob('track');
document.getElementById('trackAllBtn').onclick=startAllTracking;
document.getElementById('closeBatchReport').onclick=()=>document.getElementById('batchReport').classList.add('hidden');
for(const id of Object.values(qualityInputs))document.getElementById(id).addEventListener('input',()=>{updateQualityTotal();try{localStorage.setItem('robocoinQualityWeights',JSON.stringify(qualityWeights()))}catch(_){}});
for(const id of ('qualityMinRelativeArea qualityMinStability qualityMinSharpnessQuantile').split(' '))document.getElementById(id).addEventListener('change',()=>{try{qualityWeights()}catch(error){showToast(error.message,true)}});
document.getElementById('resetQualityBtn').onclick=()=>{for(const [key,id] of Object.entries(qualityInputs))document.getElementById(id).value=qualityDefaults[key];document.getElementById('qualityMinRelativeArea').value=.25;document.getElementById('qualityMinStability').value=.5;document.getElementById('qualityMinSharpnessQuantile').value=.1;qualityWeights();updateQualityTotal();showToast('已恢复默认质量参数')};
selectEl.onchange=()=>loadSession(selectEl.value);
frameSelectEl.onchange=()=>loadSession(session.key,frameSelectEl.value);
window.addEventListener('resize',()=>{if(viewMode==='fit')fitView()});
window.addEventListener('keydown',event=>{if(event.key==='Escape'){closeKeyframePicker();setMode('select');selected.clear();refreshUI();}if(event.key==='Delete'&&selected.size&&!busy)document.getElementById('deleteBtn').click();});
loadQualityWeights(); initialize();
</script>
</body>
</html>
