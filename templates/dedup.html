<style>

-space:nowrap}.viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;background-color:#070b11;background-image:linear-gradient(#17213055 1px,transparent 1px),linear-gradient(90deg,#17213055 1px,transparent 1px);background-size:28px 28px}.viewport.panning{cursor:grabbing}.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#48617f;stroke-width:2}.nodes{position:absolute;left:0;top:0}.category-node{position:absolute;width:220px;height:86px;overflow:hidden;padding:10px;background:linear-gradient(145deg,#17273b,#101925);border:2px solid #3c5879;border-radius:11px;box-shadow:0 7px 22px #0008;cursor:pointer;transition:.15s}.category-node:hover{border-color:#72a5d8}.category-node.selected{border-color:var(--blue);box-shadow:0 0 0 4px #59aaff45,0 7px 22px #0008}.category-node.search-hit{border-color:var(--gold);box-shadow:0 0 0 4px #f5c86b55,0 7px 22px #0008}.category-node.dragover{border-color:#55d5ff;background:#153148;box-shadow:0 0 0 4px #59dfff55}.category-node .kind{display:block;color:#75b8ff;font-size:8px;line-height:10px;letter-spacing:.12em}.category-node h3{margin:4px 25px 2px 0;font-size:14px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.category-node p{margin:0;overflow:hidden;color:var(--muted);font-size:9px;line-height:12px;white-space:nowrap;text-overflow:ellipsis}.category-node .drop-label{position:absolute;left:9px;right:9px;bottom:5px;color:#6f89a5;font-size:8px;line-height:10px;text-align:center;white-space:nowrap}.collapse-btn{position:absolute;right:7px;top:7px;width:22px;height:22px;padding:0!important;color:#bcd7f3;background:#0b1420;border:1px solid #3b536e;border-radius:5px;cursor:pointer}.zoom-overview .category-node{height:54px;padding:8px}.zoom-overview .category-node .kind,.zoom-overview .category-node p,.zoom-overview .category-node .drop-label{display:none}.zoom-overview .category-node h3{margin:8px 25px 0 0;line-height:18px}.zoom-far .category-node{height:26px;padding:0;opacity:.35}.zoom-far .category-node h3,.zoom-far .collapse-btn{visibility:hidden}.zoom-far .category-node.selected,.zoom-far .category-node.search-hit{opacity:1}.inspector{min-width:0;overflow-y:auto;background:#0c121b}.inspector-head{position:sticky;top:0;z-index:5;padding:13px;background:#111a27eF;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.inspector-head .eyebrow{color:#78baff;font-size:9px;letter-spacing:.12em}.inspector-head h2{margin:4px 0;font-size:18px}.inspector-head p{margin:0;color:var(--muted);font-size:10px}.child-links{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.child-links button{padding:4px 7px;color:#bcd5ef;background:#172538;border:1px solid #304762;border-radius:5px;font-size:9px;cursor:pointer}.section{padding:12px;border-bottom:1px solid #202d3e}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#b8c8db;font-size:11px}.cluster{margin-bottom:10px;padding:9px;background:#101924;border:2px solid #29616d;border-radius:10px}.cluster.dragover,.trash.dragover{border-color:var(--blue);background:#152b43;box-shadow:0 0 0 3px #59aaff55}.cluster-head{display:flex;justify-content:space-between;margin-bottom:7px;color:#91b7bd;font-size:9px}.cluster-head b{color:#d9fbff}.members{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.object{min-width:0;padding:5px;background:#080d14;border:1px solid #202c3d;border-radius:7px;cursor:grab}.object:active{cursor:grabbing}.object.dragging{opacity:.25}.object.search-hit{border-color:var(--gold);background:#352d14;box-shadow:0 0 0 2px #f5c86b55}.object img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#030507;border-radius:4px}.object b{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:9px}.object small{display:block;color:#718298;font-size:7px;white-space:nowrap;overflow:hid <body>
<header class="top"><a href="/review">首帧审核</a><a href="/new-library">物体库</a><a href="/object-links">名词 ID 审核</a><b>紧凑类别树 → 簇检查器</b><span class="summary" id="summary">读取中…</span></header>
<div class="toolbar"><label>CLIP阈值<input id="clipThreshold" type="number" min="-1" max="1" step="0.01" value="0.82"></label><label>属性阈值<input id="attributeThreshold" type="number" min="0" max="1" step="0.05" value="0.50"></label><button class="primary" onclick="regenerateTree()">重新自动生成树</button><button onclick="rerunPipeline()">补全属性并生成树</button><span id="message">点击类别查看簇；物体可拖到类别、簇或垃圾桶</span></div>
<div id="operationProgress" class="operation-progress indeterminate"><div id="operationLabel" class="label">正在读取类别树…</div><div class="operation-track"><div id="operationFill" class="operation-fill"></div></div><div class="operation-meta"><span id="operationPercent">准备中…</span><button id="cancelPipelineBtn" type="button" hidden>取消任务</button></div></div>
<div class="workspace" id="workspace">
  <main class="graph-shell"><div class="graph-tools"><input id="searchInput" type="search" placeholder="查询类别、属性、数据集或物体ID"><button onclick="runSearch()">查询</button><button onclick="previousMatch()">↑</button><button onclick="nextMatch()">↓</button><span class="counter" id="matchText">0/0</span><button onclick="zoomButton(1.25)">＋</button><button onclick="zoomButton(.8)">－</button><button onclick="fitGraph()">适应当前布局</button><button onclick="focusRoot()">根节点</button><button id="layoutModeBtn" onclick="toggleLayoutMode()">显示全树</button><span class="zoom" id="zoomText">100%</span><span class="hint">层级向下 · 同层横向展开 · 空白处拖动</span></div><div class="viewport" id="viewport"><div class="stage" id="stage"><svg class="edges" id="edges"></svg><div class="nodes" id="nodes"></div></div></div></main>
  <aside class="inspector" id="inspector"><div class="inspector-head"><span class="eyebrow">SELECTED CATEGORY</span><h2 id="selectedTitle">请选择类别</h2><p id="selectedStats"></p><div class="child-links" id="childLinks"></div></div><section class="section"><div class="section-title"><b>直接挂载的物体簇</b><span id="clusterCount"></span></div><div id="clusterList"></div></section><section class="section"><div class="trash" id="trash"><h3>垃圾桶</h3><p>软删除，可拖回类别或簇恢复。</p><div class="members" id="trashMembers"></div></div></section></aside>
</div>
<div class="modal hidden" id="contextModal" onclick="closeContext()"><div class="modal-card" onclick="event.stopPropagation()"><button onclick="closeContext()">关闭</button><img id="contextImage" alt="物体原始场景背景"></div></div>
<script>
let data=null,busy=false,draggedId=null,firstRender=true,selectedNodeId=null,searchObjectId=null,pipelineJobId=null,pipelineCancelRequested=false,operationCurrentPercent=0,layoutMode='focus';
let view={x:30,y:30,scale:1},worldWidth=900,worldHeight=650,searchResults=[],searchIndex=-1;
const collapsed=new Set(),entries=new Map(),nodeById=new Map(),childrenById=new Map(),clustersByNode=new Map(),statsCache=new Map(),depthById=new Map();
const NODE_W=220,NODE_H=86,COLUMN_X=260,LEVEL_Y=140,MARGIN=70,MIN_SCALE=.005,MAX_SCALE=4;
const esc=value=>String(value==null?'':value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const norm=value=>String(value==null?'':value).toLocaleLowerCase().trim();
function showOperation(message,percent=null,cancellable=false){const box=document.getElementById('operationProgress'),fill=document.getElementById('operationFill'),cancel=document.getElementById('cancelPipelineBtn');if(!Number.isFinite(percent))percent=operationCurrentPercent;box.classList.remove('hidden');box.classList.remove('indeterminate');document.getElementById('operationLabel').textContent=message;cancel.hidden=!cancellable;const value=Math.max(0,Math.min(100,Number(percent)));operationCurrentPercent=value;fill.style.width=value+'%';fill.style.transform='none';document.getElementById('operationPercent').textContent=value.toFixed(value<10?1:0)+'%'}
function hideOperation(delay=0){setTimeout(()=>document.getElementById('operationProgress').classList.add('hidden'),delay)}
function objectText(object){const a=object.attributes||{},w=object.wordnet_warning||{};return norm([object.name,object.instance_id,object.object_id,object.session_key,a.category,a.color,a.material,a.shape,a.texture,w.requested_synset,w.fallback_synset].join(' '))}
function objectHtml(object){const a=object.attributes||{},w=object.wordnet_warning||null,warning=w?`<div class="wordnet-warning" title="VLM: ${esc(w.requested_synset||'?')}；回退: ${esc(w.fallback_synset||'?')}">⚠ WordNet待人工确认：${esc(w.requested_synset||'?')} → ${esc(w.fallback_synset||'?')}</div>`:'';return `<article class="object${object.instance_id===searchObjectId?' search-hit':''}${w?' has-warning':''}" draggable="true" data-id="${esc(object.instance_id)}" data-search="${esc(objectText(object))}" title="${esc(object.session_key)}"><img src="${esc(object.best_url)}" loading="lazy"><b>${esc(object.name||a.category||'unknown')}</b>${warning}<div class="chips"><span class="chip">${esc(a.color||'?')}</span><span class="chip">${esc(a.material||'?')}</span><span class="chip">${esc(a.shape||'?')}</span></div><small>${esc(object.session_key)}</small><button class="context-btn" type="button" draggable="false" data-context-url="${esc(object.context_url)}">查看完整背景</button></article>`}
function rebuildIndexes(){nodeById.clear();childrenById.clear();clustersByNode.clear();statsCache.clear();depthById.clear();for(const node of data.nodes){nodeById.set(node.id,node);const parent=node.parent_id||'__root__';if(!childrenById.has(parent))childrenById.set(parent,[]);childrenById.get(parent).push(node)}for(const list of childrenById.values())list.sort((a,b)=>String(a.label).localeCompare(String(b.label)));function depth(id){if(depthById.has(id))return depthById.get(id);const node=nodeById.get(id),value=!node||!node.parent_id?0:depth(node.parent_id)+1;depthById.set(id,value);return value}for(const node of data.nodes)depth(node.id);for(const cluster of data.clusters){if(!clustersByNode.has(cluster.node_id))clustersByNode.set(cluster.node_id,[]);clustersByNode.get(cluster.node_id).push(cluster)}}
function nodeStats(id){if(statsCache.has(id))return statsCache.get(id);const direct=clustersByNode.get(id)||[],result={objects:direct.reduce((count,cluster)=>count+cluster.members.length,0),clusters:direct.length};statsCache.set(id,result);return result}
function visibleChildren(id){return collapsed.has(id)?[]:(childrenById.get(id)||[])}
function selectedPath(){const path=[];let node=nodeById.get(selectedNodeId)||(childrenById.get('__root__')||[])[0];while(node){path.push(node);node=node.parent_id?nodeById.get(node.parent_id):null}return path.reverse()}
function focusedNodes(){const path=selectedPath(),visible=new Map();for(const root of childrenById.get('__root__')||[])visible.set(root.id,root);for(const node of path){visible.set(node.id,node);for(const child of childrenById.get(node.id)||[])visible.set(child.id,child)}return {path,visible:[...visible.values()]}}
function layoutFocusedTree(){entries.clear();const focused=focusedNodes(),pathByDepth=new Map(focused.path.map(node=>[depthById.get(node.id)||0,node.id])),visibleIds=new Set(focused.visible.map(node=>node.id)),groups=new Map();for(const node of focused.visible){const depth=depthById.get(node.id)||0;if(!groups.has(depth))groups.set(depth,[]);groups.get(depth).push(node)}const depths=[...groups.keys()].sort((a,b)=>a-b),maxColumns=Math.max(1,...[...groups.values()].map(nodes=>nodes.length));for(const depth of depths){const pathId=pathByDepth.get(depth),alphabetical=groups.get(depth).sort((a,b)=>String(a.label).localeCompare(String(b.label))),pathNode=alphabetical.find(node=>node.id===pathId),others=alphabetical.filter(node=>node.id!==pathId),middle=Math.ceil(others.length/2),nodes=pathNode?[...others.slice(0,middle),pathNode,...others.slice(middle)]:others,startX=MARGIN+(maxColumns-nodes.length)*COLUMN_X/2;nodes.forEach((node,column)=>{const key='node:'+node.id,parentKey=node.parent_id&&visibleIds.has(node.parent_id)?'node:'+node.parent_id:null;entries.set(key,{key,node,depth,column,x:startX+column*COLUMN_X,y:MARGIN+depth*LEVEL_Y,w:NODE_W,h:NODE_H,parentKey})})}const maxDepth=depths.length?Math.max(...depths):0;worldWidth=Math.max(900,MARGIN*2+maxColumns*COLUMN_X);worldHeight=Math.max(650,MARGIN*2+(maxDepth+1)*LEVEL_Y)}
function layoutFullTree(){entries.clear();let nextLeaf=0,maxDepth=0;function place(node,depth,parentKey){const kids=visibleChildren(node.id),childEntries=kids.map(child=>place(child,depth+1,'node:'+node.id));let column;if(childEntries.length)column=(childEntries[0].column+childEntries[childEntries.length-1].column)/2;else column=nextLeaf++;const entry={key:'node:'+node.id,node,depth,column,x:MARGIN+column*COLUMN_X,y:MARGIN+depth*LEVEL_Y,w:NODE_W,h:NODE_H,parentKey};entries.set(entry.key,entry);maxDepth=Math.max(maxDepth,depth);return entry}for(const root of childrenById.get('__root__')||[]){place(root,0,null);nextLeaf++}worldWidth=Math.max(900,MARGIN*2+Math.max(1,nextLeaf)*COLUMN_X);worldHeight=Math.max(650,MARGIN*2+(maxDepth+1)*LEVEL_Y)}
function layoutTree(){layoutMode==='focus'?layoutFocusedTree():layoutFullTree()}
function dropZone(el,handler){el.ondragover=e=>{e.preventDefault();e.stopPropagation();el.classList.add('dragover')};el.ondragleave=e=>{e.stopPropagation();el.classList.remove('dragover')};el.ondrop=e=>{e.preventDefault();e.stopPropagation();el.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain')||draggedId;if(id)handler(id)}}
function bindObjects(root){root.querySelectorAll('.object').forEach(el=>{el.ondragstart=e=>{draggedId=el.dataset.id;el.classList.add('dragging');e.dataTransfer.setData('text/plain',draggedId);e.dataTransfer.effectAllowed='move'};el.ondragend=()=>{draggedId=null;el.classList.remove('dragging')}});root.querySelectorAll('.context-btn').forEach(button=>button.onclick=e=>{e.preventDefault();e.stopPropagation();showContext(button.dataset.contextUrl)})}
function renderGraph(){layoutTree();const nodes=document.getElementById('nodes'),svg=document.getElementById('edges'),stage=document.getElementById('stage'),modeButton=document.getElementById('layoutModeBtn');modeButton.textContent=layoutMode==='focus'?'显示全树':'聚焦当前分支';modeButton.title=layoutMode==='focus'?`当前显示 ${entries.size}/${data.nodes.length} 个类别节点`:'当前显示完整类别树';nodes.innerHTML='';svg.innerHTML='';for(const value of [nodes,svg,stage]){value.style.width=worldWidth+'px';value.style.height=worldHeight+'px'}svg.setAttribute('width',worldWidth);svg.setAttribute('height',worldHeight);for(const entry of entries.values()){if(!entry.parentKey)continue;const parent=entries.get(entry.parentKey);if(!parent)continue;const x1=parent.x+parent.w/2,y1=parent.y+parent.h,x2=entry.x+entry.w/2,y2=entry.y,bend=(y1+y2)/2,path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','edge');path.setAttribute('d',`M ${x1} ${y1} C ${x1} ${bend},${x2} ${bend},${x2} ${y2}`);svg.appendChild(path)}for(const entry of entries.values()){const n=entry.node,s=nodeStats(n.id),kids=childrenById.get(n.id)||[],el=document.createElement('article');el.className='category-node'+(selectedNodeId===n.id?' selected':'')+(entry.depth>2?' deep':'');el.dataset.nodeId=n.id;el.style.cssText=`left:${entry.x}px;top:${entry.y}px`;el.innerHTML=`<span class="kind">CATEGORY · DEPTH ${entry.depth}</span><h3 title="${esc(n.definition||'')}">${esc(n.label)}</h3><p>${s.objects}个物体 · ${s.clusters}个簇${kids.length?' · '+kids.length+'个子类':''}</p><span class="drop-label">拖入：在此类别新建簇</span>${kids.length&&layoutMode==='full'?`<button class="collapse-btn" title="${collapsed.has(n.id)?'展开':'折叠'}">${collapsed.has(n.id)?'+':'−'}</button>`:''}`;el.onclick=()=>selectNode(n.id);const toggle=el.querySelector('.collapse-btn');if(toggle)toggle.onclick=e=>{e.stopPropagation();collapsed.has(n.id)?collapsed.delete(n.id):collapsed.add(n.id);renderGraph();applyView()};dropZone(el,id=>moveObject(id,null,n.id));nodes.appendChild(el)}applyView()}
function renderInspector(){const node=nodeById.get(selectedNodeId),list=document.getElementById('clusterList'),trashMembers=document.getElementById('trashMembers');if(!node){document.getElementById('selectedTitle').textContent='请选择类别';document.getElementById('selectedStats').textContent='';list.innerHTML='';return}const stats=nodeStats(node.id),direct=clustersByNode.get(node.id)||[],children=childrenById.get(node.id)||[];document.getElementById('selectedTitle').textContent=node.label;document.getElementById('selectedStats').textContent=`当前节点：${stats.objects}个物体 · ${stats.clusters}个簇${children.length?' · '+children.length+'个直接子类':''}`;document.getElementById('childLinks').innerHTML=children.map(child=>`<button data-node="${esc(child.id)}">${esc(child.label)}</button>`).join('');document.querySelectorAll('#childLinks button').forEach(button=>button.onclick=()=>selectNode(button.dataset.node));document.getElementById('clusterCount').textContent=direct.length+'个';list.innerHTML=direct.length?direct.map(cluster=>`<article class="cluster" data-cluster="${esc(cluster.id)}"><div class="cluster-head"><b>CLUSTER · ${cluster.members.length}个</b><span>${cluster.origin==='manual'?'人工':'属性 + CLIP'}</span></div><div class="members">${cluster.members.map(objectHtml).join('')}</div></article>`).join(''):'<div class="empty">这个类别没有直接挂载的簇。点击子类别继续查看，或把物体拖到树上的这个节点。</div>';trashMembers.innerHTML=(data.trash||[]).map(objectHtml).join('');document.querySelectorAll('.cluster').forEach(el=>dropZone(el,id=>moveObject(id,el.dataset.cluster,null)));dropZone(document.getElementById('trash'),trashObject);bindObjects(document.getElementById('inspector'));if(searchObjectId)setTimeout(()=>document.querySelector(`.object[data-id="${CSS.escape(searchObjectId)}"]`)?.scrollIntoView({block:'center'}),20)}
function selectNode(id){selectedNodeId=id;renderGraph();renderInspector();if(layoutMode==='focus')focusNode(id)}
function toggleLayoutMode(){layoutMode=layoutMode==='focus'?'full':'focus';renderGraph();layoutMode==='focus'?focusNode(selectedNodeId):fitGraph()}
function applyView(){const vp=document.getElementById('viewport');document.getElementById('stage').style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;document.getElementById('zoomText').textContent=Math.round(view.scale*100)+'%';vp.classList.toggle('zoom-overview',view.scale<.48);vp.classList.toggle('zoom-far',view.scale<.2)}
function zoomAt(factor,cx,cy){const vp=document.getElementById('viewport'),r=vp.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,old=view.scale,next=Math.max(MIN_SCALE,Math.min(MAX_SCALE,old*factor));view.x=px-(px-view.x)*next/old;view.y=py-(py-view.y)*next/old;view.scale=next;applyView()}
function zoomButton(factor){const r=document.getElementById('viewport').getBoundingClientRect();zoomAt(factor,r.left+r.width/2,r.top+r.height/2)}
function fitGraph(){const vp=document.getElementById('viewport'),pad=55;view.scale=Math.max(MIN_SCALE,Math.min(1,(vp.clientWidth-pad*2)/worldWidth,(vp.clientHeight-pad*2)/worldHeight));view.x=(vp.clientWidth-worldWidth*view.scale)/2;view.y=(vp.clientHeight-worldHeight*view.scale)/2;applyView()}
function focusNode(id,scale=.9){const entry=entries.get('node:'+id),vp=document.getElementById('viewport');if(!entry)return;view.scale=Math.max(.55,Math.min(1.2,scale));view.x=vp.clientWidth/2-(entry.x+entry.w/2)*view.scale;view.y=vp.clientHeight/2-(entry.y+entry.h/2)*view.scale;applyView()}
function focusRoot(){const root=(childrenById.get('__root__')||[])[0];if(root){expandAncestors(root.id);renderGraph();selectNode(root.id);focusNode(root.id,1)}}
function expandAncestors(id){let current=nodeById.get(id);while(current){collapsed.delete(current.id);current=current.parent_id?nodeById.get(current.parent_id):null}}
function buildSearch(){const query=norm(document.getElementById('searchInput').value);searchResults=[];searchIndex=-1;searchObjectId=null;if(!query)return;for(const node of data.nodes)if(norm([node.id,node.label,node.definition].join(' ')).includes(query))searchResults.push({type:'node',nodeId:node.id});for(const cluster of data.clusters)for(const object of cluster.members)if(objectText(object).includes(query))searchResults.push({type:'object',nodeId:cluster.node_id,objectId:object.instance_id})}
function activateMatch(){if(searchIndex<0||!searchResults.length)return;const hit=searchResults[searchIndex];expandAncestors(hit.nodeId);selectedNodeId=hit.nodeId;searchObjectId=hit.objectId||null;renderGraph();renderInspector();focusNode(hit.nodeId);const nodeEl=document.querySelector(`.category-node[data-node-id="${CSS.escape(hit.nodeId)}"]`);if(nodeEl)nodeEl.classList.add('search-hit');document.getElementById('matchText').textContent=`${searchIndex+1}/${searchResults.length}`}
function runSearch(){buildSearch();if(searchResults.length){searchIndex=0;activateMatch()}else document.getElementById('matchText').textContent='0/0'}
function nextMatch(){if(!searchResults.length)return;searchIndex=(searchIndex+1)%searchResults.length;activateMatch()}
function previousMatch(){if(!searchResults.length)return;searchIndex=(searchIndex-1+searchResults.length)%searchResults.length;activateMatch()}
function showContext(url){const modal=document.getElementById('contextModal'),image=document.getElementById('contextImage');image.src=url+'?ts='+Date.now();modal.classList.remove('hidden')}
function closeContext(){document.getElementById('contextModal').classList.add('hidden');document.getElementById('contextImage').src=''}
async function request(url,body,targetNode=null){if(busy)return;busy=true;document.getElementById('workspace').classList.add('busy');const message=document.getElementById('message');message.textContent='正在保存并重建物体库…';showOperation('正在提交树修改…',5);try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});showOperation('服务端已完成聚类和建库，正在读取结果…',72);const result=await response.json();if(!response.ok)throw new Error(result.detail||'操作失败');data=result.tree;showOperation('正在更新类别、簇和物体索引…',82);rebuildIndexes();if(targetNode)selectedNodeId=targetNode;showOperation('正在重新排版图形树…',92);renderGraph();renderInspector();message.textContent='已保存，类别树、簇和物体库已同步';showOperation('保存和重建完成',100);hideOperation(700)}catch(error){message.textContent='失败：'+error.message;showOperation('操作失败：'+error.message,100);hideOperation(1800);alert(error.message)}finally{busy=false;document.getElementById('workspace').classList.remove('busy')}}
function moveObject(instanceId,targetClusterId,targetNodeId){request('/api/dedup-tree/move',{instance_id:instanceId,target_cluster_id:targetClusterId,target_node_id:targetNodeId},targetNodeId)}
function trashObject(instanceId){request('/api/dedup-tree/trash',{instance_id:instanceId})}
async function regenerateTree(){if(confirm('根据当前属性和CLIP重新生成整棵树？现有人工布局会归档。'))await request('/api/dedup-tree/regenerate',{clip_threshold:Number(document.getElementById('clipThreshold').value),attribute_threshold:Number(document.getElementById('attributeThreshold').value)})}
async function rerunPipeline(){if(busy||!confirm('补全属性标注、计算CLIP并生成树。已缓存的有效属性会跳过，剩余任务可能需要数小时。继续？'))return;busy=true;pipelineCancelRequested=false;pipelineJobId=null;document.getElementById('workspace').classList.add('busy');const message=document.getElementById('message'),cancel=document.getElementById('cancelPipelineBtn');message.textContent='正在补全属性、计算CLIP并生成树…';showOperation('正在启动后台流水线…',0,true);cancel.disabled=true;cancel.textContent='取消任务';try{const response=await fetch('/api/pipeline/vlm/job',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tracker:'sam3',force:false})}),started=await response.json();if(!response.ok)throw new Error(started.detail||'流水线启动失败');pipelineJobId=started.job_id;cancel.disabled=false;let result;while(true){await new Promise(resolve=>setTimeout(resolve,2000));const status=await fetch('/api/review/job/'+pipelineJobId),payload=await status.json();if(!status.ok)throw new Error(payload.detail||'读取任务进度失败');result=payload;if(result.progress)showOperation(result.progress.message,result.progress.percent,true);else showOperation('后台流水线正在运行…',null,true);if(!result.running)break}if(result.cancelled||pipelineCancelRequested){message.textContent='流水线已取消；已完成的属性缓存已经保存';showOperation('流水线已取消，可稍后继续',result.progress?.percent??null,false);hideOperation(1800);return}if(result.return_code!==0){const cleaned=(result.log||'').split('\n').filter(line=>!line.includes('@@PROGRESS ')).slice(-8).join(' ').trim();throw new Error(cleaned||'流水线失败')}await load();message.textContent='属性、CLIP和树已更新';showOperation('属性、CLIP和树已全部更新',100,false);hideOperation(900)}catch(error){message.textContent='失败：'+error.message;showOperation('流水线失败：'+error.message,100,false);hideOperation(3000)}finally{busy=false;pipelineJobId=null;pipelineCancelRequested=false;cancel.hidden=true;document.getElementById('workspace').classList.remove('busy')}}
async function cancelPipeline(){if(!pipelineJobId||pipelineCancelRequested)return;if(!confirm('确定取消当前流水线吗？已完成的属性标注会保留，下次可以继续。'))return;pipelineCancelRequested=true;const button=document.getElementById('cancelPipelineBtn');button.disabled=true;button.textContent='正在取消…';showOperation('正在停止模型并释放GPU…',null,true);try{const response=await fetch('/api/review/job/'+pipelineJobId+'/cancel',{method:'POST'}),result=await response.json();if(!response.ok)throw new Error(result.detail||'取消失败')}catch(error){pipelineCancelRequested=false;button.disabled=false;button.textContent='取消任务';document.getElementById('message').textContent='取消失败：'+error.message}}
function initNavigation(){const vp=document.getElementById('viewport');vp.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0012),e.clientX,e.clientY)},{passive:false});let pan=null,resizeTimer=null;vp.addEventListener('pointerdown',e=>{if(e.button||e.target.closest('.category-node,button,input'))return;pan={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};vp.classList.add('panning');vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!pan)return;view.x=pan.vx+e.clientX-pan.x;view.y=pan.vy+e.clientY-pan.y;applyView()});vp.addEventListener('pointerup',()=>{pan=null;vp.classList.remove('panning')});document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!data)return;renderGraph();layoutMode==='focus'?focusNode(selectedNodeId):fitGraph()},120)})}
async function load(finalRefresh=false){finalRefresh=finalRefresh||Boolean(pipelineJobId);const p=value=>finalRefresh?100:value;showOperation('正在读取类别树数据…',p(5));const response=await fetch('/api/dedup-tree?ts='+Date.now(),{cache:'no-store'});showOperation('类别树已读取，正在解析数据…',p(35));data=await response.json();if(!response.ok){showOperation('类别树加载失败',100);return}showOperation('正在建立类别和簇索引…',p(55));rebuildIndexes();if(!selectedNodeId){const richest=[...clustersByNode.entries()].sort((a,b)=>b[1].length-a[1].length)[0];selectedNodeId=richest?richest[0]:(data.nodes[0]||{}).id}showOperation('正在计算树布局…',p(72));renderGraph();showOperation('正在渲染物体簇…',p(88));renderInspector();document.getElementById('summary').textContent=`${data.object_count}个物体 · ${data.cluster_count}个簇 · ${data.nodes.length}个类别节点`;document.getElementById('clipThreshold').value=data.settings.clip_threshold??.82;document.getElementById('attributeThreshold').value=data.settings.attribute_threshold??.5;if(firstRender){setTimeout(fitGraph,0);firstRender=false}showOperation('类别树加载完成',100);if(!finalRefresh)hideOperation(350)}
document.getElementById('cancelPipelineBtn').onclick=cancelPipeline;
initNavigation();load();
</script>
